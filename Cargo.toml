[package]
name = "herdr-chronoid"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Per-pane time reporting from Herdr into Chronoid: billable attention, plus agent runtime off the billable books"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "herdr-chronoid"
path = "src/main.rs"
